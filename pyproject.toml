[project]
name = "vpn-connect"
version = "0.1.0"
description = "Local web control panel for the OpenVPN client on this machine"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
    "flask>=3.0",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]
# Deliberately its own group rather than part of dev: only `tools/screenshots.py` needs it, it is
# never imported by the app or the suite, and CI (`uv sync --frozen`, which takes dev alone) must
# not spend a download on a browser driver it will never drive.
#   uv run --group screenshots python tools/screenshots.py
screenshots = [
    "playwright>=1.40",
]
# The browser journeys under uitests/. Its own group rather than a share of `screenshots` above:
# they are separate things that happen to want the same driver -- one is a build tool for the
# documentation, the other is a test suite with a workflow of its own -- and the redundancy is
# cheaper than a group whose name stops describing what asks for it.
#   uv run --group ui pytest uitests/
ui = [
    "playwright>=1.40",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Dummy credentials in fixtures and helper defaults are the point of these files.
"tests/*" = ["S105", "S106", "S107"]
# Invented credentials for a database that lives in /tmp for thirty seconds, and a *seeded* RNG so
# the fake traffic graph comes out identical every time the screenshots are regenerated.
"tools/screenshots.py" = ["S105", "S106", "S311"]
# Browser tests: the same fixture-credential exemption the unit tests get.
"uitests/*" = ["S105", "S106", "S107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

# Coverage is deliberately *not* in addopts. Instrumentation costs about a third of the run time,
# and the plain `uv run pytest` that gets typed twenty times an hour should stay as fast as it can
# be. Ask for it when you want it -- `uv run pytest --cov=app` -- which is what CI does.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
# A floor, not a target. It sits below where the suite actually is, so it catches a change that
# guts the tests rather than nagging about a line or two -- and it is the number to raise
# deliberately, never to lower quietly.
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
