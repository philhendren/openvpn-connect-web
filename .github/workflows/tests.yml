# Runs the suite on every pull request, and on pushes to main.
#
# Nothing here needs openvpn, dnsmasq or systemd: the tests fake subprocess.run, the management
# socket and every HTTP call, and assert on the argv that *would* have run. That is what makes a
# stock ubuntu runner a fair place to run them.

name: tests

# Both triggers on purpose. `push` is what makes a branch go green before anyone opens anything;
# `pull_request` is what covers PRs from forks, whose pushes never reach this repository. The cost
# is that a PR from a branch *in* this repo runs twice, which is the usual trade and cheap here.
on:
  push:
  pull_request:

# A second push to a PR makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Both versions report, rather than the second being cancelled by the first failure --
      # "fails only on 3.12" is the useful half of the answer.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      # Both on node24: the node20 runtime these were on before is deprecated, and the runner was
      # already forcing them onto node24 with a warning on every job. checkout publishes a moving
      # major tag; setup-uv does not, so it is pinned to an exact release and has to be bumped by
      # hand when its runtime moves again.
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # Without a suffix every job derives the same cache key and they race to save it, which
          # the runner reports as "Unable to reserve cache ... another job may be creating this
          # cache". Harmless, but it is a warning on every run, and a warning nobody acts on is
          # one nobody reads.
          cache-suffix: py${{ matrix.python-version }}

      # --frozen throughout: uv.lock is committed, so CI must fail on a lockfile that no longer
      # matches pyproject.toml rather than quietly resolving something newer and testing that.
      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      # Coverage runs here but not in the local default (see pyproject.toml): CI has the time, and
      # a number nobody can see is a number nobody maintains. The floor that fails the job lives
      # in pyproject.toml, so it is the same one a developer hits locally.
      - name: Run tests
        run: uv run --frozen pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      # One version's report is enough -- the two legs cover the same lines, and two summaries on
      # a run would just be noise.
      # Three places, because they are read by different people at different times: a notice on
      # the run page (visible without opening anything), the job log (where someone debugging a
      # failure already is), and the run summary (which survives as the record of the run).
      - name: Coverage summary
        if: matrix.python-version == '3.13'
        run: |
          total="$(uv run --frozen coverage report --format=total --precision=1)"
          echo "::notice title=Coverage::Total coverage ${total}%"
          {
            echo "## Coverage: ${total}%"
            echo
            uv run --frozen coverage report --format=markdown
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # shields.io's "endpoint" schema rather than a raw number, so the colour is decided here
      # (where the thresholds can be read) instead of being hardcoded into the README, where a
      # badge would go on claiming green all the way down. The total is recomputed rather than
      # carried from the step above: the two are independent, and a badge that silently inherited
      # a stale variable is the failure this file cannot see.
      - name: Badge data
        if: matrix.python-version == '3.13'
        run: |
          total="$(uv run --frozen coverage report --format=total --precision=1)"
          colour="$(awk -v t="$total" 'BEGIN {
            print (t >= 90) ? "brightgreen" : (t >= 80) ? "green" : (t >= 70) ? "yellow" : "red"
          }')"
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$total" "$colour" > coverage.json
          cat coverage.json

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.json
          retention-days: 14

  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: lint   # its own key, for the reason given in the test job

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run --frozen ruff check .

      - name: ruff format
        run: uv run --frozen ruff format --check .

      # The shell is part of the privilege boundary here, so a syntax error in it matters as much
      # as one in the Python. Only a parse check: the helper is a template full of @PLACEHOLDER@
      # tokens and is never executed in this form.
      - name: Shell syntax
        run: |
          for script in install_prerequisites.sh deploy/install.sh deploy/vpn-connect-helper.in; do
            bash -n "$script" && echo "ok: $script"
          done

  # Its own job rather than a step in `ruff` above: this is the only thing in the repository that
  # wants Node, and the Python job should not grow a toolchain it never uses. It is still in this
  # workflow rather than a file of its own, because it is a lint and belongs with the lints --
  # ui.yml earned separation by needing a browser download and a genuinely different failure mode.
  lint-js:
    name: oxlint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # v7 targets node24. v4 does not -- see the note beside the actions above.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Pinned exactly, like setup-uv and for the same reason: a linter that quietly gains a rule
      # on a new release turns a green branch red without anybody having committed anything. The
      # config, and the reasoning for every rule in it, is in .oxlintrc.json.
      #
      # No package.json and no node_modules: oxlint is a single binary that npx fetches and runs,
      # so linting the JavaScript leaves nothing behind in the tree.
      - name: oxlint
        run: npx --yes oxlint@1.79.0 -c .oxlintrc.json app/static/js/

  # The README's coverage badge reads coverage.json from the `badges` branch through
  # shields.io, so something has to keep that file current. This is the only job that writes to
  # the repository, and it is fenced in three ways: it runs on pushes to main and nowhere else,
  # it is the only job granted contents: write, and it touches exactly one path. A pull request
  # -- including one from a fork -- never reaches it.
  # Badge data goes to the unprotected `badges` branch, never to main. main requires a pull
  # request and passing checks, so a job pushing to it is refused outright with GH006 -- which is
  # exactly what happened the first time the coverage number actually moved, having been hidden
  # until then by the "nothing to commit" short-circuit.
  #
  # continue-on-error, because of what that failure did: this job lives in the tests workflow, so
  # it failing turned the *tests* badge red while every test had passed. A badge that reports a
  # test failure that did not happen is worse than a badge that is briefly stale, and this whole
  # feature exists to say what is true. The job still reports its own failure on the run.
  badge:
    name: coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # v8 targets node24; v6 is still node20 -- see the version table in the project notes.
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          # Staged outside the working tree on purpose. The orphan-branch path below clears
          # the checkout down to .git, and an artifact downloaded *into* the tree goes with
          # it -- which is why the branch could never rebuild itself after being deleted.
          path: ${{ runner.temp }}/badge

      - name: Publish the badge data
        run: |
          set -euo pipefail
          NAME="coverage.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
              # Re-read the branch at the top of every attempt, so a retry rebuilds on whatever
              # is there now rather than replaying a stale tip. It is also what makes the two
              # workflows' badge jobs safe to run at once: they write different files, and
              # whichever arrives second simply builds on the first.
              if git fetch --quiet origin badges 2>/dev/null; then
                  git checkout --quiet -B badges FETCH_HEAD
              else
                  # First run, or after somebody deletes the branch. Branched from main rather
                  # than orphaned: GitHub offers "Compare & pull request" for any recently
                  # pushed branch, there is no setting to turn that off, and the one workaround
                  # -- open a pull request and close it -- cannot be applied to a branch with no
                  # common ancestor, because GitHub refuses to compare unrelated histories.
                  # So the branch has to stay comparable for the prompt to be dismissable.
                  git checkout --quiet -B badges HEAD
              fi

              cp "$RUNNER_TEMP/badge/$NAME" "$NAME"
              git add "$NAME"
              if git diff --cached --quiet; then
                  echo "$NAME is unchanged; nothing to publish."
                  exit 0
              fi
              git commit --quiet -m "Update $NAME [skip ci]"
              if git push --quiet origin badges; then
                  echo "Published $NAME."
                  exit 0
              fi
              echo "Push rejected (attempt $attempt); rebuilding on the current tip."
          done
          echo "Could not publish $NAME after three attempts." >&2
          exit 1
